name: CI Images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ci
      - .github/workflows/ci-images.yml
  workflow_dispatch:

concurrency:
  group: ci-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build CI images
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set image name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/mod-openai-realtime-ci" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SDK image metadata
        id: sdk-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sdk-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=mod_openai_realtime CI SDK
            org.opencontainers.image.description=Build and static-analysis environment for mod_openai_realtime

      - name: Build SDK image
        id: sdk-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          target: sdk
          platforms: linux/amd64
          push: true
          tags: ${{ steps.sdk-meta.outputs.tags }}
          labels: ${{ steps.sdk-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          # Checkpoint the expensive FreeSWITCH build even if the integration build fails later.
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,ignore-error=true

      - name: Integration image metadata
        id: integration-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=integration-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=mod_openai_realtime integration environment
            org.opencontainers.image.description=Pinned FreeSWITCH runtime and SDK for mod_openai_realtime tests

      - name: Build integration image
        id: integration-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          target: integration
          platforms: linux/amd64
          push: true
          tags: ${{ steps.integration-meta.outputs.tags }}
          labels: ${{ steps.integration-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,ignore-error=true

      - name: Test published integration image
        env:
          INTEGRATION_BASE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.integration-build.outputs.digest }}
          TEST_IMAGE: mod-openai-realtime-tests:${{ github.sha }}
          TEST_ARTIFACT_DIR: ${{ runner.temp }}/mod-openai-test-artifacts
        run: ./tests/run-integration.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-images-diagnostics
          path: ${{ runner.temp }}/mod-openai-test-artifacts
          retention-days: 7

      - name: Promote verified aliases
        if: github.ref == 'refs/heads/main'
        env:
          CI_IMAGE: ${{ steps.image.outputs.name }}
          SDK_DIGEST: ${{ steps.sdk-build.outputs.digest }}
          INTEGRATION_DIGEST: ${{ steps.integration-build.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${CI_IMAGE}:sdk" \
            "${CI_IMAGE}@${SDK_DIGEST}"
          docker buildx imagetools create \
            --tag "${CI_IMAGE}:integration" \
            "${CI_IMAGE}@${INTEGRATION_DIGEST}"

      - name: Summarize immutable image references
        env:
          CI_IMAGE: ${{ steps.image.outputs.name }}
          SDK_DIGEST: ${{ steps.sdk-build.outputs.digest }}
          INTEGRATION_DIGEST: ${{ steps.integration-build.outputs.digest }}
        run: |
          {
            echo "### Published CI images"
            echo
            echo "- SDK: \`${CI_IMAGE}@${SDK_DIGEST}\`"
            echo "- Integration: \`${CI_IMAGE}@${INTEGRATION_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
