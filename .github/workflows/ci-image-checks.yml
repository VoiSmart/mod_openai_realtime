name: CI Image Checks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - Dockerfile.ci
      - .github/workflows/ci-images.yml
      - .github/workflows/ci-image-checks.yml
  workflow_dispatch:

concurrency:
  group: ci-image-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Build and test CI image
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build integration environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ci
          target: integration
          platforms: linux/amd64
          load: true
          tags: mod-openai-realtime-integration:ci
          cache-from: type=registry,ref=ghcr.io/voismart/mod-openai-realtime-ci:buildcache

      - name: Run unit and integration tests
        env:
          INTEGRATION_BASE_IMAGE: mod-openai-realtime-integration:ci
          TEST_ARTIFACT_DIR: ${{ runner.temp }}/mod-openai-test-artifacts
        run: ./tests/run-integration.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-checks-diagnostics
          path: ${{ runner.temp }}/mod-openai-test-artifacts
          retention-days: 7
