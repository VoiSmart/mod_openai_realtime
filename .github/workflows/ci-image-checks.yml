name: CI Image Checks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - Dockerfile.ci
      - .github/workflows/ci-images.yml
      - .github/workflows/ci-image-checks.yml
  workflow_dispatch:

concurrency:
  group: ci-image-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Build and test CI image
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build integration environment
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.ci
          target: integration
          platforms: linux/amd64
          load: true
          tags: mod-openai-realtime-integration:ci
          cache-from: type=registry,ref=ghcr.io/voismart/mod-openai-realtime-ci:buildcache

      - name: Run unit and integration tests
        env:
          INTEGRATION_BASE_IMAGE: mod-openai-realtime-integration:ci
          TEST_ARTIFACT_DIR: ${{ runner.temp }}/mod-openai-test-artifacts
        run: ./tests/run-integration.sh

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-checks-diagnostics
          path: ${{ runner.temp }}/mod-openai-test-artifacts
          retention-days: 7
